# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-deny: what the server's dependencies may be (CI, job `deps`; the terminal app has its own, apps/tui/deny.toml). Known vulnerabilities fail the build, licences
# must be compatible with the AGPL, crates come only from crates.io. A finding that does not affect kernoid is ignored
# below with a reason, never silently.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, but only those kernoid depends on directly fail the build.
unmaintained = "workspace"
# Three of rpgp's dependencies, which kernoid takes through apps/e2e (RFC 0006) – the same reasons as in
# apps/e2e/deny.toml. The server never decrypts or signs with an account's key: it only encrypts to public keys and
# reads them.
ignore = [
    # crypto-bigint 0.5 (NIST curves, X448) is not constant-time; the fix is 0.7.6, which rpgp 0.21 does not take.
    # kernoid's keys are Curve25519 and ML-KEM/ML-DSA, and secret keys of other kinds are refused.
    { id = "RUSTSEC-2026-0387", reason = "no secret key of kernoid's is on a curve crypto-bigint 0.5 computes" },
    # ml-dsa 0.0.4 signs in variable time; rpgp 0.21 requires it. The server never signs with ML-DSA.
    { id = "RUSTSEC-2025-0144", reason = "ML-DSA signs only in the user's client, never as a service anyone can time" },
    # RSA decryption is not constant-time (Marvin), with no fixed version; kernoid never uses an RSA secret key.
    { id = "RUSTSEC-2023-0071", reason = "no RSA secret key is ever used; only public RSA operations" },
]

[licenses]
confidence-threshold = 0.93
# Compatible with the AGPL-3.0: permissive licences, the weak copyleft of MPL-2.0 (webauthn-rs) and LGPL-2.1+
# (r-efi, UEFI targets only), and the AGPL itself (kernoid, sieve-rs).
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates refer to each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
