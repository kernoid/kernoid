# SPDX-License-Identifier: AGPL-3.0-or-later
# A relay of end-to-end encrypted spaces and nothing else (RFC 0010, 4): kernoid with the service relay alone and
# PostgreSQL – no object storage: large envelopes are kept in PostgreSQL too (`[blob] kind = "database"`). For the
# spaces of a program's apps – aktujo's, say – on a small server. Copy env.example to .env and set the passwords
# (GARAGE_RPC_SECRET and the S3 values are not used here), then:
#   docker compose -f relay.yaml up -d
# Spaces are founded by accounts of this installation (identity is built in); to let anyone found them, create a
# tenant (`docker compose -f relay.yaml exec kernoid kernoid tenant …`) and set KERNOID__RELAY__OPEN_FOR_TENANT to its
# id below. Not for production as it is: no TLS, no backups.
name: kernoid-relay

services:
  kernoid:
    image: ${KERNOID_IMAGE:-ghcr.io/kernoid/kernoid:0.7.0}
    pull_policy: missing
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment: &kernoid-env
      KERNOID__DATABASE__URL: postgres://kernoid_app:${KERNOID_APP_PASSWORD:?set in .env}@postgres/kernoid
      KERNOID__BLOB__KIND: database
      KERNOID__SERVICES__MAIL: "false"
      KERNOID__SERVICES__CALENDARS: "false"
      KERNOID__SERVICES__FILES: "false"
      KERNOID__SERVICES__RELAY: "true"
      # The programs whose spaces the relay keeps, by the scheme of their signed requests.
      KERNOID__RELAY__DOMAINS: '["kernoid", "aktujo"]'
      KERNOID__ENCRYPTION__MAIN_KEY: ${KERNOID_MAIN_KEY:?set in .env}
      # Reached over plain HTTP here; put kernoid behind TLS (or set [http.tls]) and remove this for real use.
      KERNOID__HTTP__PUBLIC_SCHEME: http
      KERNOID__HTTP__PUBLIC_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  # Brings the schema up to date before kernoid starts. Only this step knows the owner's password.
  migrate:
    image: ${KERNOID_IMAGE:-ghcr.io/kernoid/kernoid:0.7.0}
    pull_policy: missing
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *kernoid-env
      KERNOID__DATABASE__MIGRATE_URL: postgres://kernoid_owner:${KERNOID_OWNER_PASSWORD:?set in .env}@postgres/kernoid

  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KERNOID_OWNER_PASSWORD: ${KERNOID_OWNER_PASSWORD:?set in .env}
      KERNOID_APP_PASSWORD: ${KERNOID_APP_PASSWORD:?set in .env}
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/kernoid.sh:ro
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "kernoid"]
      interval: 2s
      retries: 30
    restart: unless-stopped

volumes:
  postgres:
