# SPDX-License-Identifier: AGPL-3.0-or-later
# kernoid for a small installation or for trying it out: one kernoid process with every role, PostgreSQL and
# Garage as S3-compatible object storage. Copy env.example to .env and set the passwords, then:
#   docker compose up -d
# Not for production as it is: no TLS, no backups.
name: kernoid

services:
  kernoid:
    # The released image; KERNOID_IMAGE picks another, e.g. one built from this checkout (docs: Getting started).
    image: ${KERNOID_IMAGE:-ghcr.io/kernoid/kernoid:0.2.2}
    pull_policy: missing
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
    environment: &kernoid-env
      KERNOID__DATABASE__URL: postgres://kernoid_app:${KERNOID_APP_PASSWORD:?set in .env}@postgres/kernoid
      KERNOID__BLOB__KIND: s3
      KERNOID__BLOB__ENDPOINT: http://s3:3900
      KERNOID__BLOB__REGION: garage
      KERNOID__BLOB__ALLOW_HTTP: "true"
      KERNOID__BLOB__BUCKET: kernoid
      KERNOID__BLOB__ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      KERNOID__BLOB__SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set in .env}
      KERNOID__ENCRYPTION__MAIN_KEY: ${KERNOID_MAIN_KEY:?set in .env}
      # Reached over plain HTTP here; put kernoid behind TLS (or set [http.tls]) and remove this for real use.
      KERNOID__HTTP__PUBLIC_SCHEME: http
      # Reached on port 8080 of this machine: issuer and links name it. Remove it behind a proxy on 443.
      KERNOID__HTTP__PUBLIC_PORT: "8080"
      # Receiving mail: the name the tenants' MX records point to. Inside the container kernoid listens on 2525 (it
      # runs without root); publish it as port 25 of the host for real use.
      KERNOID__SMTP__HOSTNAME: ${KERNOID_MAIL_HOSTNAME:-mail.localhost}
      KERNOID__SMTP__LISTEN: 0.0.0.0:2525
      # Submission (587, 465) needs certificates, which this setup has not; without root, use high ports here too.
      KERNOID__SMTP__SUBMISSION_LISTEN: 0.0.0.0:5587
      KERNOID__SMTP__SUBMISSIONS_LISTEN: 0.0.0.0:5465
      # IMAP (143, 993) needs certificates as well; without them kernoid says so in its log and does not listen.
      KERNOID__IMAP__LISTEN: 0.0.0.0:5143
      KERNOID__IMAP__TLS_LISTEN: 0.0.0.0:5993
      # The virus scan module (docs: Modules): KERNOID_CLAMAV=true in .env and `docker compose --profile clamav up -d`;
      # tenants then switch it on for themselves.
      KERNOID__MODULES__CLAMAV__ENABLED: ${KERNOID_CLAMAV:-false}
      KERNOID__MODULES__CLAMAV__ADDRESS: clamav:3310
      # The image's StreamMaxLength.
      KERNOID__MODULES__CLAMAV__MAX_SIZE: "104857600"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2525:2525"
    restart: unless-stopped

  # Brings the schema up to date before kernoid starts; with several kernoid processes it runs once. Only this
  # step knows the owner's password.
  migrate:
    image: ${KERNOID_IMAGE:-ghcr.io/kernoid/kernoid:0.2.2}
    pull_policy: missing
    command: ["migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *kernoid-env
      KERNOID__DATABASE__MIGRATE_URL: postgres://kernoid_owner:${KERNOID_OWNER_PASSWORD:?set in .env}@postgres/kernoid

  # clamd for the module clamav; the image keeps its signatures current (freshclam).
  clamav:
    image: docker.io/clamav/clamav:1.5.4-debian13-slim
    profiles: [clamav]
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KERNOID_OWNER_PASSWORD: ${KERNOID_OWNER_PASSWORD:?set in .env}
      KERNOID_APP_PASSWORD: ${KERNOID_APP_PASSWORD:?set in .env}
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/kernoid.sh:ro
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "kernoid"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Garage (https://garagehq.deuxfleurs.fr) on one node. Its image holds only the binary, so it is copied into
  # Alpine for the start script, which also creates the layout, the access key and the bucket.
  s3:
    build:
      dockerfile_inline: |
        FROM docker.io/dxflrs/garage:v2.4.1 AS garage
        FROM docker.io/library/alpine:3.24.3
        COPY --from=garage /garage /usr/local/bin/garage
    image: kernoid-garage:v2.4.1-alpine3.24.3
    command: ["/bin/sh", "/garage-start.sh"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    configs:
      - source: garage
        target: /etc/garage.toml
    volumes:
      - ./garage-start.sh:/garage-start.sh:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 2s
      retries: 60
    restart: unless-stopped

configs:
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "lmdb"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

volumes:
  postgres:
  garage-meta:
  garage-data:
