# SPDX-License-Identifier: AGPL-3.0-or-later
# Format, lints, the sqlx query cache, tests against PostgreSQL and the API files of the documentation; the web
# SDK, login UI and web app (types, tests, build); the terminal app (its own Cargo workspace: format, lints, tests);
# the licence checks (REUSE, no Stalwart Enterprise License material); known vulnerabilities and licences of the
# dependencies; the container image builds, and is pushed to ghcr.io from main and version tags. Actions are pinned
# by commit, with the version as a comment.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: kernoid
          POSTGRES_PASSWORD: kernoid
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kernoid" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kernoid:kernoid@localhost:5432/kernoid
      # Without debug info target/ stays small enough for the runner's disk (the linker died with SIGBUS once).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: sqlx CLI
        run: cargo install sqlx-cli@0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Migrations apply
        run: cargo sqlx migrate run --source crates/kernoid-store/migrations
      - name: Query cache (.sqlx) matches the queries and the schema
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - name: The API files of the documentation (docs/) match the code
        run: |
          df -h .
          cargo build --locked -q --bin kernoid
          ./target/debug/kernoid openapi | diff - docs/_data/openapi.json
          ./target/debug/kernoid graphql-schema | diff - docs/api/schema.graphql
      - run: cargo test --locked
      - if: always()
        run: df -h .

  # The terminal app: a Cargo workspace of its own (MIT), apart from the server's.
  tui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/tui
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked --release

  # The Kubernetes operator: a workspace of its own (operator/); its CustomResourceDefinition must be the one in
  # deploy/kubernetes.
  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: operator
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: The CustomResourceDefinition is current
        run: cargo run --locked -q -- crd | diff - ../deploy/kubernetes/crd.json

  web:
    runs-on: ubuntu-latest
    container: docker.io/library/node:26.11.1-trixie-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@12.12.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

  # Known vulnerabilities, licences and sources of the dependencies (deny.toml, apps/tui/deny.toml; pnpm's audit for
  # web/). Separate from the image: an advisory published today fails this job, not the release of unrelated changes.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Server
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Terminal app
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/tui/Cargo.toml
      - name: Operator
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: operator/Cargo.toml
      - name: Web
        working-directory: web
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@12.12.0
          pnpm audit

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No Stalwart Enterprise License material
        run: ./scripts/check-sel.sh
      - uses: fsfe/reuse-action@9a55738c6490d015afe69ad187520395d2b7a1fa # v6.0.0

  # Builds the image for every change, for amd64 and arm64 – each on a runner of its own architecture, since
  # building Rust under emulation takes hours. From main and version tags, once the other jobs passed, each pushes its
  # image by digest, and `manifest` names both with the tags: `main` and `sha-<commit>` from main, the version
  # (`0.2.0`, `0.2`) from a tag `v0.2.0`.
  image:
    needs: [rust, tui, operator, web, licences]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed without a tag: `manifest` gives the tags to both architectures at once.
          outputs: ${{ env.PUSH == 'true' && 'type=image,name=ghcr.io/kernoid/kernoid,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          # Layers that did not change (the web build, the toolchain stage) come from GitHub's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: env.PUSH == 'true'
        run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kernoid/kernoid
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("ghcr.io/kernoid/kernoid@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "ghcr.io/kernoid/kernoid:${{ steps.meta.outputs.version }}"

  # An installation of the last release, with mail and a file in it, upgraded to the image just pushed: the schema
  # migrated to the newest migration, the data still there (scripts/upgrade-check.sh).
  upgrade:
    needs: manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          from=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          scripts/upgrade-check.sh "$from" "ghcr.io/kernoid/kernoid:sha-${{ github.sha }}"
