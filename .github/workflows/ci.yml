# SPDX-License-Identifier: AGPL-3.0-or-later
# Format, lints, the sqlx query cache, tests against PostgreSQL and the API files of the documentation – on Linux and
# on macOS; the web SDK, login UI and web app (types, tests, build); the terminal app (its own Cargo workspace:
# format, lints, tests); the operator and its Helm chart; no Stalwart Enterprise License material; known
# vulnerabilities and licences of the dependencies; the container image builds, and is pushed to ghcr.io from main.
# A version tag checks nothing again: it releases the commit main's run checked – its image under the version, the
# operator's Helm chart, the Rust SDK on crates.io – and checks the upgrade from the release before. The licence check
# (REUSE) and the sign-off (DCO) come from falkoss/starterpack, pinned by commit. Actions are pinned by commit, with the
# version as a comment.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: kernoid
          POSTGRES_PASSWORD: kernoid
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kernoid" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://kernoid:kernoid@localhost:5432/kernoid
      # Without debug info target/ stays small enough for the runner's disk (the linker died with SIGBUS once).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - name: sqlx CLI
        run: cargo install sqlx-cli@0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Migrations apply
        run: cargo sqlx migrate run --source crates/kernoid-store/migrations
      - name: Query cache (.sqlx) matches the queries and the schema
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - name: The API files of the documentation (docs/) match the code
        run: |
          df -h .
          cargo build --locked -q --bin kernoid
          ./target/debug/kernoid openapi | diff - docs/_data/openapi.json
          ./target/debug/kernoid graphql-schema | diff - docs/api/schema.graphql
      - run: cargo test --locked
      - name: The Rust SDK and kernoid-sync against this kernoid
        run: scripts/client-check.sh target/debug/kernoid
      - if: always()
        run: df -h .

  # kernoid's Rust SDK (apps/client, MIT): a workspace of its own, tested against a server that records requests.
  client:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/client
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  # kernoid-sync (apps/sync, MIT): a folder kept in step with a file store, on the SDK. Against a real kernoid in the
  # job `rust` (scripts/client-check.sh).
  sync:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/sync
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked

  # The terminal app: a Cargo workspace of its own (AGPL), apart from the server's, on the SDK.
  tui:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/tui
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - run: cargo build --locked --release

  # The end-to-end library (apps/e2e, MIT): a workspace of its own, tested natively and built as WebAssembly for the
  # web app, which takes the build from here.
  e2e:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: apps/e2e
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo clippy --locked --target wasm32-unknown-unknown --features wasm
      - run: cargo test --locked
      - name: WebAssembly for the web app
        run: |
          cargo install wasm-bindgen-cli --version "$(scripts/wasm-bindgen-version.sh)" --locked
          scripts/build-wasm.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-wasm
          path: web/e2e/dist
          retention-days: 7

  # The Kubernetes operator: a workspace of its own (operator/); its CustomResourceDefinition must be the one in
  # deploy/kubernetes and in the Helm chart, which must lint (with the runner's Helm).
  operator:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: operator
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: The CustomResourceDefinition is current
        run: |
          cargo run --locked -q -- crd | diff - ../deploy/kubernetes/crd.json
          diff ../deploy/kubernetes/crd.json ../deploy/helm/kernoid-operator/crds/kernoids.kernoid.dev.json
      - name: The Helm chart
        run: |
          helm lint ../deploy/helm/kernoid-operator
          helm lint ../deploy/helm/kernoid-operator --set watchNamespace=mail

  web:
    needs: e2e
    runs-on: ubuntu-latest
    container: docker.io/library/node:26.11.1-trixie-slim
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-wasm
          path: web/e2e/dist
      - run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@12.12.0
      - run: pnpm install --frozen-lockfile
      - name: The administration's API types match docs/_data/openapi.json
        run: |
          cp app/src/admin/api-types.ts /tmp/api-types.ts
          pnpm --filter @kernoid/app run api
          diff /tmp/api-types.ts app/src/admin/api-types.ts
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run build

  # Known vulnerabilities, licences and sources of the dependencies (deny.toml, apps/*/deny.toml; pnpm's audit for
  # web/). Separate from the image: an advisory published today fails this job, not the release of unrelated changes.
  deps:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Server
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - name: Terminal app
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/tui/Cargo.toml
      - name: Operator
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: operator/Cargo.toml
      - name: End-to-end library
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/e2e/Cargo.toml
      - name: Rust SDK
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/client/Cargo.toml
      - name: kernoid-sync
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/sync/Cargo.toml
      - name: Web
        working-directory: web
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@12.12.0
          pnpm audit

  # The server, the SDK and the terminal app on macOS too, where much of the development happens. macOS runners have no
  # containers: PostgreSQL comes from Homebrew, its major version pinned (the minor one is Homebrew's).
  macos:
    if: github.ref_type != 'tag'
    runs-on: macos-latest
    env:
      DATABASE_URL: postgres://kernoid:kernoid@localhost:5432/kernoid
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PostgreSQL 18
        run: |
          brew install postgresql@18
          brew services start postgresql@18
          bin="$(brew --prefix postgresql@18)/bin"
          for _ in $(seq 1 30); do "$bin/pg_isready" -h localhost && break; sleep 1; done
          "$bin/createuser" -h localhost --superuser kernoid
          "$bin/psql" -h localhost -d postgres -c "ALTER ROLE kernoid PASSWORD 'kernoid'"
          "$bin/createdb" -h localhost --owner kernoid kernoid
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          workspaces: |
            .
            apps/client
            apps/sync
            apps/tui
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: Rust SDK
        working-directory: apps/client
        run: |
          cargo clippy --locked --all-targets
          cargo test --locked
      - name: kernoid-sync
        working-directory: apps/sync
        run: |
          cargo clippy --locked --all-targets
          cargo test --locked
      - name: Terminal app
        working-directory: apps/tui
        run: |
          cargo clippy --locked --all-targets
          cargo test --locked

  # No material under the Stalwart Enterprise License (scripts/check-sel.sh).
  stalwart:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/check-sel.sh

  # The licence check (REUSE) and a sign-off (DCO) on every commit of a pull request, from falkoss/starterpack, pinned
  # by commit.
  licences:
    if: github.ref_type != 'tag'
    uses: falkoss/starterpack/.github/workflows/reuse.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
  sign-off:
    if: github.ref_type != 'tag'
    uses: falkoss/starterpack/.github/workflows/dco.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585

  # Builds the image for every change, for amd64 and arm64 – each on a runner of its own architecture, since
  # building Rust under emulation takes hours. From main, once every other check passed, each pushes its image by
  # digest, and `manifest` names both `main` and `sha-<commit>` – so an image `sha-<commit>` says that commit passed
  # all of them, and `release` gives it a version.
  image:
    needs: [rust, client, sync, macos, tui, e2e, operator, web, deps, stalwart, licences]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed without a tag: `manifest` gives the tags to both architectures at once.
          outputs: ${{ env.PUSH == 'true' && 'type=image,name=ghcr.io/kernoid/kernoid,push-by-digest=true,name-canonical=true,push=true' || 'type=cacheonly' }}
          # Layers that did not change (the web build, the toolchain stage) come from GitHub's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - if: env.PUSH == 'true'
        run: |
          mkdir -p digests
          digest='${{ steps.build.outputs.digest }}'
          touch "digests/${digest#sha256:}"
      - if: env.PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kernoid/kernoid
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long,enable={{is_default_branch}}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=()
          for digest in *; do images+=("ghcr.io/kernoid/kernoid@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${images[@]}"
          docker buildx imagetools inspect "ghcr.io/kernoid/kernoid:sha-${{ github.sha }}"

  # A release, from a tag `v0.2.1` on a commit of main: nothing is built or checked again. The image main's run pushed
  # for the commit – there only once every check passed – gets the version's tags (`0.2.1`, `0.2`); the job waits for
  # main's run when the commit and the tag were pushed together.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release a commit of main"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The image main's run checked, under the version
        run: |
          checked="ghcr.io/kernoid/kernoid:sha-$GITHUB_SHA"
          for _ in $(seq 1 90); do
            docker buildx imagetools inspect "$checked" >/dev/null 2>&1 && break
            echo "waiting for main's run to push $checked"
            sleep 60
          done
          docker buildx imagetools inspect "$checked" >/dev/null \
            || { echo "::error::no $checked: push the commit to main and let its run pass first"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t "ghcr.io/kernoid/kernoid:$version" -t "ghcr.io/kernoid/kernoid:${version%.*}" "$checked"
          docker buildx imagetools inspect "ghcr.io/kernoid/kernoid:$version"

  # The operator's Helm chart, on a release: its version must be the tag's; pushed next to the image as an OCI chart,
  # oci://ghcr.io/kernoid/charts/kernoid-operator (with the runner's Helm).
  chart:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The chart's version is the release's
        run: |
          chart="$(helm show chart deploy/helm/kernoid-operator | sed -n 's/^version: //p')"
          app="$(helm show chart deploy/helm/kernoid-operator | sed -n 's/^appVersion: //p' | tr -d '"')"
          test "v$chart" = "$GITHUB_REF_NAME" && test "v$app" = "$GITHUB_REF_NAME"
      - name: Push it
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          helm package deploy/helm/kernoid-operator --destination /tmp/chart
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push /tmp/chart/kernoid-operator-*.tgz oci://ghcr.io/kernoid/charts

  # The Rust SDK on crates.io, on a release: kernoid-e2e, kernoid-client and kernoid-sync in this order, each in the
  # tag's version, through crates.io's trusted publishing (a short-lived token for this workflow and the environment
  # `crates-io`, no stored secret). A version already on crates.io is left alone, so the job can run again. The crates
  # were checked by main's run of the commit, which `release` waited for.
  crates:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: apps/client
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in e2e client sync; do
            name="kernoid-$crate"
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "apps/$crate/Cargo.toml" | head -1)
            test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::$name is $version, the tag $GITHUB_REF_NAME"; exit 1; }
            if curl -fsS -A "kernoid release (https://github.com/kernoid/kernoid)" \
                 "https://crates.io/api/v1/crates/$name/$version" >/dev/null 2>&1; then
              echo "$name $version is on crates.io already"; continue
            fi
            (cd "apps/$crate" && cargo publish --locked)
          done

  # An installation of the last release, with mail and a file in it, upgraded to the image just pushed: the schema
  # migrated to the newest migration, the data still there (scripts/upgrade-check.sh). The image is the one this run
  # pushed – `sha-<commit>` from main, the version from a tag.
  upgrade:
    needs: [manifest, release]
    if: always() && (needs.manifest.result == 'success' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          from=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          case "$GITHUB_REF" in
            refs/tags/v*) image="ghcr.io/kernoid/kernoid:${GITHUB_REF_NAME#v}" ;;
            *) image="ghcr.io/kernoid/kernoid:sha-${{ github.sha }}" ;;
          esac
          scripts/upgrade-check.sh "$from" "$image"
