# The documentation site kernoid.dev: docs/ built with Jekyll and published with GitHub Actions on every change of
# docs/ on main; on a pull request only built. The workflow comes from falkoss/starterpack, pinned by commit; the
# domain is set in the repository's Pages settings.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer one replaces one that waits.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    uses: falkoss/starterpack/.github/workflows/pages-jekyll.yml@1e2fad7b6afb0f45f7d62d6a9472c97484ff4585
    with:
      source: docs
      publish: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
