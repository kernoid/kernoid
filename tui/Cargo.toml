# SPDX-License-Identifier: AGPL-3.0-or-later
# kernoid's terminal app: mail, files, calendars and contacts over JMAP, on kernoid's Rust SDK (`../client`, MIT). AGPL
# like the server, but a workspace of its own, apart from the server's, so it shares neither code nor the lock file with
# it: only the protocols connect them. Dependencies are exact (`=`) and at least two weeks old when taken
# (`scripts/check-age.py`).
[workspace]

[package]
name = "kernoid-tui"
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kernoid/kernoid"
description = "kernoid in the terminal: mail, files, calendars and contacts over JMAP"
homepage = "https://kernoid.dev"

[[bin]]
name = "kernoid-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
# The vaults' sealing key, made from the system's random numbers.
getrandom = "=0.3.4"
# Dates and times in the system's time zone (Unlicense OR MIT) – in place of chrono (RUSTSEC-2026-0543).
jiff = "=1.0.1"
# kernoid's Rust SDK (MIT): JMAP, push, end-to-end encryption, DNS, iCalendar and vCard files – async; the app waits for
# it on a runtime of its own (`block`).
kernoid-client = { version = "0.7.0", path = "../kit/client" }
ratatui = "=0.30.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["fs", "rt-multi-thread"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }

# The system's key store, the terminal's echo and the console (`src/system.rs`): the Keychain through security-framework
# (MIT OR Apache-2.0), termios through libc, the Credential Manager and the console through windows-sys (both MIT OR
# Apache-2.0) – the Secret Service elsewhere is kernoid's own D-Bus client (`src/dbus.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Console"] }

# Argon2 (unlocking the key) and the post-quantum algorithms are slow without optimisation; tests build dependencies
# optimised, as the end-to-end library does.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
# Denied, not forbidden: `src/system.rs` alone allows it, for the C interfaces of termios and Windows.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
