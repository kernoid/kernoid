# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]
# The kit (MIT, RFC 0008) and the terminal app are workspaces of their own; the server takes kernoid-e2e from the kit by
# path, as a dependency, never as a member.
exclude = ["kit", "tui"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kernoid/kernoid"
homepage = "https://kernoid.dev"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds keep file and line for backtraces, not the full debug information: the build directory stays a
# fraction of the size (the full one grew to hundreds of GB).
[profile.dev]
debug = "line-tables-only"
