# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]
# The end-to-end library is a dependency of the server, not a member: a workspace of its own (MIT), like apps/tui.
exclude = ["apps/e2e"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kernoid/kernoid"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# The tests of calcard and jmap-tools, taken over from Stalwart, run only there (with its test resources).
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(stalwart_tests)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds keep file and line for backtraces, not the full debug information: the build directory stays a
# fraction of the size (the full one grew to hundreds of GB).
[profile.dev]
debug = "line-tables-only"
