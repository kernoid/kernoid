# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The MX, submission and the queue's sending (RFC 0002, 9, 10); without it only the client (identity alone).
server = [
    "dep:aws-lc-rs", "dep:bytes", "dep:jiff", "dep:jiff-sqlx", "dep:idna", "dep:kernoid-config", "dep:kernoid-groupware",
    "dep:kernoid-identity", "dep:kernoid-mail", "dep:kernoid-oidc", "dep:kernoid-store", "dep:mail-builder",
    "dep:mail-auth", "dep:mail-parser", "dep:rustls-webpki", "dep:sha2", "dep:tokio-util", "dep:sqlx", "dep:tracing",
    "dep:uuid", "dep:x509-cert", "dep:zeroize", "tokio/sync", "tokio/rt", "tokio/macros",
]

[dependencies]
aws-lc-rs = { version = "1.18.2", optional = true }
base64 = "0.22.1"
bytes = { version = "1.12.1", optional = true }
jiff = { version = "1.0.1", features = ["serde"], optional = true }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"], optional = true }
idna = { version = "1.1.0", optional = true }
kernoid-config = { version = "0.5.1", path = "../kernoid-config", optional = true }
kernoid-groupware = { version = "0.5.1", path = "../kernoid-groupware", optional = true }
kernoid-identity = { version = "0.5.1", path = "../kernoid-identity", optional = true }
kernoid-mail = { version = "0.5.1", path = "../kernoid-mail", optional = true }
kernoid-oidc = { version = "0.5.1", path = "../kernoid-oidc", optional = true }
kernoid-store = { version = "0.5.1", path = "../kernoid-store", optional = true }
mail-builder = { version = "2.0.0", optional = true }
mail-auth = { version = "0.15.1", default-features = false, features = ["aws-lc-rs", "arc"], optional = true }
mail-parser = { version = "1.0.0", features = ["full_encoding"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
rustls-webpki = { version = "0.103.16", default-features = false, features = ["aws-lc-rs", "std"], optional = true }
sha2 = { version = "0.11.1", optional = true }
smtp-proto = "0.2.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = { version = "0.7.20", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "sqlx-toml"], optional = true }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.28.0", features = ["v7"], optional = true }
webpki-roots = "1.0.10"
x509-cert = { version = "0.2.5", optional = true }
zeroize = { version = "1.9.1", optional = true }

[dev-dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
tokio-util = "0.7.20"
kernoid-identity = { path = "../kernoid-identity" }
mail-auth = { version = "0.15.1", default-features = false, features = ["aws-lc-rs", "arc"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false }
kernoid-events = { path = "../kernoid-events" }
kernoid-store = { path = "../kernoid-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
