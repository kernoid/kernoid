[package]
name = "kernoid-jitsi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
getrandom = "0.4.3"
hmac = "0.13.0"
kernoid-module = { version = "0.2.2", path = "../kernoid-module" }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid"] }
toml = "1.1.8"
tracing = "0.1.44"
url = "2.5.8"
uuid = "1.28.0"

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
kernoid-config = { path = "../kernoid-config" }
kernoid-events = { path = "../kernoid-events" }
kernoid-identity = { path = "../kernoid-identity" }
kernoid-store = { path = "../kernoid-store" }
object_store = "0.14.2"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
