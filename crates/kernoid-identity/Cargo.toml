# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid's identity: instances, tenants, accounts, sessions, groups, roles and projects"

[lints]
workspace = true

[features]
# `passkey::soft`: a passkey in memory, for tests – of this crate and of those on it.
soft-passkey = []

[dependencies]
argon2 = "0.6.0"
aws-lc-rs = "1.18.2"
base64 = "0.22.1"
jiff = { version = "1.0.1", features = ["serde"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
getrandom = "0.4.3"
hickory-resolver = "0.26.3"
kernoid-e2e = { version = "0.5.1", path = "../../kit/e2e" }
kernoid-events = { version = "0.5.1", path = "../kernoid-events" }
kernoid-store = { version = "0.5.1", path = "../kernoid-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
x509-cert = "0.2.5"
zeroize = "1.9.1"

[dev-dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
argon2 = "0.6.0"
aws-lc-rs = "1.18.2"
kernoid-store = { path = "../kernoid-store" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.28.0", features = ["v7"] }
# The software passkey of the tests (`passkey::soft`).
kernoid-identity = { path = ".", features = ["soft-passkey"] }
