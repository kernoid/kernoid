[package]
name = "kernoid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
kernoid-clamav = { version = "0.2.2", path = "../kernoid-clamav" }
kernoid-config = { version = "0.2.2", path = "../kernoid-config" }
kernoid-events = { version = "0.2.2", path = "../kernoid-events" }
kernoid-identity = { version = "0.2.2", path = "../kernoid-identity" }
kernoid-jitsi = { version = "0.2.2", path = "../kernoid-jitsi" }
kernoid-ldap = { version = "0.2.2", path = "../kernoid-ldap" }
kernoid-imap = { version = "0.2.2", path = "../kernoid-imap" }
kernoid-dav = { version = "0.2.2", path = "../kernoid-dav" }
kernoid-files = { version = "0.2.2", path = "../kernoid-files" }
kernoid-groupware = { version = "0.2.2", path = "../kernoid-groupware" }
kernoid-jmap = { version = "0.2.2", path = "../kernoid-jmap" }
kernoid-mail = { version = "0.2.2", path = "../kernoid-mail" }
kernoid-module = { version = "0.2.2", path = "../kernoid-module" }
kernoid-oidc = { version = "0.2.2", path = "../kernoid-oidc" }
kernoid-server = { version = "0.2.2", path = "../kernoid-server" }
kernoid-smtp = { version = "0.2.2", path = "../kernoid-smtp" }
kernoid-store = { version = "0.2.2", path = "../kernoid-store" }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
rpassword = "7.5.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.28.0"
