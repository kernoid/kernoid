# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid's program: identity, mail, calendars, contacts and files in one binary"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
getrandom = "0.4.3"
jiff = { version = "1.0.1", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
kernoid-clamav = { version = "0.6.0", path = "../kernoid-clamav" }
kernoid-config = { version = "0.6.0", path = "../kernoid-config" }
kernoid-events = { version = "0.6.0", path = "../kernoid-events" }
kernoid-identity = { version = "0.6.0", path = "../kernoid-identity" }
kernoid-jitsi = { version = "0.6.0", path = "../kernoid-jitsi" }
kernoid-ldap = { version = "0.6.0", path = "../kernoid-ldap" }
kernoid-imap = { version = "0.6.0", path = "../kernoid-imap" }
kernoid-dav = { version = "0.6.0", path = "../kernoid-dav" }
kernoid-files = { version = "0.6.0", path = "../kernoid-files" }
kernoid-groupware = { version = "0.6.0", path = "../kernoid-groupware" }
kernoid-jmap = { version = "0.6.0", path = "../kernoid-jmap" }
kernoid-mail = { version = "0.6.0", path = "../kernoid-mail" }
kernoid-module = { version = "0.6.0", path = "../kernoid-module" }
kernoid-oidc = { version = "0.6.0", path = "../kernoid-oidc" }
kernoid-relay = { version = "0.6.0", path = "../kernoid-relay" }
kernoid-server = { version = "0.6.0", path = "../kernoid-server" }
kernoid-smtp = { version = "0.6.0", path = "../kernoid-smtp" }
kernoid-store = { version = "0.6.0", path = "../kernoid-store" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
zeroize = "1.9.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.28.0"

[target.'cfg(unix)'.dependencies]
# The terminal's echo off while a secret is typed (`no_echo`).
rustix = { version = "1.1.6", default-features = false, features = ["std", "termios"] }
