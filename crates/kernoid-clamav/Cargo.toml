[package]
name = "kernoid-clamav"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
kernoid-module = { version = "0.2.2", path = "../kernoid-module" }
kernoid-store = { version = "0.2.2", path = "../kernoid-store" }
tokio = { version = "1.54.1", features = ["net", "io-util", "time"] }
toml = "1.1.8"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
