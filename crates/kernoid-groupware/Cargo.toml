# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-groupware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
smallvec = "1.16.3"
ahash = "0.8.12"
calcard = { version = "1.1.0", path = "../calcard" }
jiff = { version = "1.0.1", features = ["serde", "tzdb-bundle-always"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
kernoid-mail = { version = "0.5.1", path = "../kernoid-mail" }
kernoid-store = { version = "0.5.1", path = "../kernoid-store" }
indexmap = "2.14.2"
mail-builder = "2.0.0"
mail-parser = { version = "1.0.0", features = ["full_encoding"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "sqlx-toml"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
kernoid-events = { path = "../kernoid-events" }
kernoid-identity = { path = "../kernoid-identity" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
