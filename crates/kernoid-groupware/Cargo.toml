# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-groupware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid's calendars and contacts store"

[lints]
workspace = true

[dependencies]
jiff = { version = "1.0.1", features = ["serde", "tzdb-bundle-always"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
kernoid-mail = { version = "0.6.0", path = "../kernoid-mail" }
# iCalendar, vCard, recurrences, JSCalendar and JSContact – the kit's library (MIT), by path as kernoid-e2e.
kernoid-pim = { version = "0.6.0", path = "../../kit/pim" }
kernoid-store = { version = "0.6.0", path = "../kernoid-store" }
# Mail messages: the kit's library (MIT), by path.
kernoid-mime = { version = "0.6.0", path = "../../kit/mime" }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "sqlx-toml"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
kernoid-events = { path = "../kernoid-events" }
kernoid-identity = { path = "../kernoid-identity" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
