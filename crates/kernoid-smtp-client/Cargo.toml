# SPDX-License-Identifier: AGPL-3.0-or-later
# kernoid's SMTP client, derived from Stalwart's (its source file is AGPL-3.0-only): the queue's deliveries and the
# submission of kernoid's own messages through a relay. A crate of its own, so that identity alone can send codes.
[package]
name = "kernoid-smtp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
smtp-proto = "0.2.5"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false }
webpki-roots = "1.0.10"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
