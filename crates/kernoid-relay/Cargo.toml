# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid as the relay of end-to-end encrypted spaces"

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
jiff = { version = "1.0.1", features = ["serde"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
kernoid-base = { version = "0.7.0", path = "../../kit/base" }
kernoid-crypt = { version = "0.7.0", path = "../../kit/crypt" }
kernoid-store = { version = "0.7.0", path = "../kernoid-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "sqlx-toml"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
# The feature `node`: a server as one more node of spaces of streams (`node`) – kernoid-spaces' engine without its
# SQLite store, the server keeps SQLite out of its build.
kernoid-log = { version = "0.7.0", path = "../../kit/log", optional = true }
kernoid-spaces = { version = "0.7.0", path = "../../kit/spaces", default-features = false, features = ["native"], optional = true }
tokio = { version = "1.54.1", features = ["rt"], optional = true }

[features]
node = ["dep:kernoid-log", "dep:kernoid-spaces", "dep:tokio"]

[dev-dependencies]
http-body-util = "0.1.5"
kernoid-config = { path = "../kernoid-config" }
kernoid-log = { path = "../../kit/log" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5.3", features = ["util"] }

# The node against the relay: `cargo test -p kernoid-relay --features node` (CI's job rust).
[[test]]
name = "node"
required-features = ["node"]
