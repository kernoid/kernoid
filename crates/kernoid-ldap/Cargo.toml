# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-ldap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid's directory over LDAPv3, read only"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
kernoid-config = { version = "0.5.1", path = "../kernoid-config" }
kernoid-identity = { version = "0.5.1", path = "../kernoid-identity" }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false }
tokio-util = { version = "0.7.20", features = ["codec"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = "1.28.0"

[dev-dependencies]
kernoid-events = { path = "../kernoid-events" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
kernoid-store = { path = "../kernoid-store" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
