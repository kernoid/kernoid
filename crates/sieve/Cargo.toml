# SPDX-License-Identifier: AGPL-3.0-only
# Taken over from Stalwart's crates/sieve (v1.1.0); dependencies as it declares them, each at its oldest version that
# fits and at least two weeks old.
[package]
name = "sieve-rs"
description = "Sieve filter interpreter"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
publish.workspace = true

# Not kernoid's workspace lints: the interpreter uses unsafe code. `stalwart_tests` is the cfg under which Stalwart
# reads its tests from a repository of its own (not public, not taken over).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(stalwart_tests)"] }

[lib]
name = "sieve"
doctest = false

[dependencies]
mail-parser = { version = "1.0.0", features = ["full_encoding"] }
fancy-regex = "0.20.0"
bumpalo = { version = "3.20.3", features = ["collections"] }
memchr = "2.8.3"
encodify = "1.0.2"
smallvec = "1.16.3"
hashbrown = "0.17.1"
hashify = "0.3.1"
serde = { version = "1.0.229", features = ["derive", "rc"], optional = true }
mail-builder = "2.0.0"
ahash = "0.8.12"

[features]
default = []
serde = ["dep:serde", "mail-parser/serde"]
