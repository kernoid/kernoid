# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-jmap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JMAP for kernoid's mail, calendars, contacts and files"

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
jiff = { version = "1.0.1", features = ["serde", "tzdb-bundle-always"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
kernoid-e2e = { version = "0.7.0", path = "../../kit/e2e" }
kernoid-pim = { version = "0.7.0", path = "../../kit/pim" }
kernoid-files = { version = "0.7.0", path = "../kernoid-files" }
kernoid-groupware = { version = "0.7.0", path = "../kernoid-groupware" }
kernoid-identity = { version = "0.7.0", path = "../kernoid-identity" }
kernoid-store = { version = "0.7.0", path = "../kernoid-store" }
base64 = "0.22.1"
futures-util = { version = "0.3.34", default-features = false }
kernoid-mail = { version = "0.7.0", path = "../kernoid-mail" }
# Mail messages: the kit's library (MIT), by path.
kernoid-mime = { version = "0.7.0", path = "../../kit/mime" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "uuid", "sqlx-toml"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }
kernoid-files = { path = "../kernoid-files" }
kernoid-groupware = { path = "../kernoid-groupware" }
kernoid-events = { path = "../kernoid-events" }
kernoid-identity = { path = "../kernoid-identity" }
kernoid-store = { path = "../kernoid-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
