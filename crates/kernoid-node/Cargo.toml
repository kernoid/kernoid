[package]
name = "kernoid-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A server as one more node of end-to-end encrypted spaces: what a device keeps in SQLite, kept in PostgreSQL"

[lints]
workspace = true

[dependencies]
kernoid-base = { version = "0.7.0", path = "../../kit/base" }
kernoid-crypt = { version = "0.7.0", path = "../../kit/crypt" }
kernoid-log = { version = "0.7.0", path = "../../kit/log" }
# The engine of spaces of streams without its SQLite store: the server keeps SQLite out of its build.
kernoid-spaces = { version = "0.7.0", path = "../../kit/spaces", default-features = false, features = ["native"] }
kernoid-store = { version = "0.7.0", path = "../kernoid-store" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "sqlx-toml"] }
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
axum = "0.8.9"
kernoid-relay = { path = "../kernoid-relay" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
uuid = { version = "1.28.0", features = ["v7"] }
