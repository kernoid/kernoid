# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "kernoid-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kernoid's HTTP server: REST, GraphQL, JMAP, WebDAV and the login UI – or identity alone"

[lints]
workspace = true

[features]
default = ["mail", "calendars", "files", "relay"]
# The services of RFC 0008, 4. Built without them, kernoid-server is identity alone – for programs that build it in
# (RFC 0009, 3); the binary takes them all.
mail = ["data"]
calendars = ["data"]
files = ["data"]
# The relay of kernoid's foundation (RFC 0010, 4).
relay = ["dep:kernoid-relay"]
# What the three need: the stores of mail, calendars and files, and JMAP and WebDAV, which serve them together.
data = ["dep:kernoid-dav", "dep:kernoid-files", "dep:kernoid-groupware", "dep:kernoid-jmap", "dep:kernoid-mail", "kernoid-smtp/server", "dep:kernoid-mime"]

[dependencies]
async-graphql = "7.2.1"
aws-lc-rs = "1.18.2"
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false }
jiff = { version = "1.0.1", features = ["serde"] }
jiff-sqlx = { version = "1.0.0", features = ["postgres", "serde"] }
ipnet = "2.12.2"
kernoid-e2e = { version = "0.6.0", path = "../../kit/e2e" }
kernoid-config = { version = "0.6.0", path = "../kernoid-config" }
kernoid-events = { version = "0.6.0", path = "../kernoid-events" }
kernoid-identity = { version = "0.6.0", path = "../kernoid-identity" }
kernoid-dav = { version = "0.6.0", path = "../kernoid-dav", optional = true }
kernoid-files = { version = "0.6.0", path = "../kernoid-files", optional = true }
kernoid-groupware = { version = "0.6.0", path = "../kernoid-groupware", optional = true }
kernoid-jmap = { version = "0.6.0", path = "../kernoid-jmap", optional = true }
kernoid-mail = { version = "0.6.0", path = "../kernoid-mail", optional = true }
kernoid-module = { version = "0.6.0", path = "../kernoid-module" }
kernoid-oidc = { version = "0.6.0", path = "../kernoid-oidc" }
kernoid-relay = { version = "0.6.0", path = "../kernoid-relay", optional = true }
# Always its client (kernoid's own messages through a relay); its server with `data`.
kernoid-smtp = { version = "0.6.0", path = "../kernoid-smtp", default-features = false }
kernoid-store = { version = "0.6.0", path = "../kernoid-store" }
# The login UI and the web app, built (served at /login and /app unless `http.login_ui`/`http.web_app` name a directory).
kernoid-web = { version = "0.6.0", path = "../kernoid-web" }
kernoid-mime = { version = "0.6.0", path = "../../kit/mime", optional = true }
metrics = "0.24.6"
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
tokio-util = "0.7.20"
tower-http = { version = "0.6.11", features = ["request-id", "trace", "propagate-header", "timeout", "limit", "catch-panic", "util", "fs", "cors"] }
tracing = "0.1.44"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["axum_extras", "jiff_0_2"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v4"] }
x509-cert = "0.2.5"
zeroize = "1.9.1"

[dev-dependencies]
kernoid-jmap = { path = "../kernoid-jmap" }
kernoid-mail = { path = "../kernoid-mail" }
base64 = "0.22.1"
aws-lc-rs = "1.18.2"
http-body-util = "0.1.5"
kernoid-config = { path = "../kernoid-config" }
kernoid-events = { path = "../kernoid-events" }
# The software passkey of the tests (`passkey::soft`).
kernoid-identity = { path = "../kernoid-identity", features = ["soft-passkey"] }
kernoid-oidc = { path = "../kernoid-oidc" }
kernoid-store = { path = "../kernoid-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = "0.29.0"
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
