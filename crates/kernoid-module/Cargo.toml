[package]
name = "kernoid-module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
kernoid-events = { version = "0.2.1", path = "../kernoid-events" }
kernoid-store = { version = "0.2.1", path = "../kernoid-store" }
thiserror = "2.0.21"
tokio-util = "0.7.20"
toml = "1.1.8"
uuid = "1.28.0"

[dev-dependencies]
kernoid-config = { path = "../kernoid-config" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
