# SPDX-License-Identifier: AGPL-3.0-or-later
# Licence and copyright of files that cannot carry a header (REUSE specification 3.3). Source files name their own
# licence in an SPDX header; code taken over from Stalwart or derived from Zitadel also names its origin there.
version = 1

# Where several annotations match a file, only the last one counts – so each one names the copyright.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"

[[annotations]]
path = ["**/*.md", "Cargo.lock", "operator/Cargo.lock", "deploy/kubernetes/crd.json", "deploy/helm/kernoid-operator/crds/kernoids.kernoid.dev.json", ".sqlx/**", "**/.gitignore", ".dockerignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The documentation's text under CC BY 4.0, as the RFCs and the whitepaper: text moves freely between them.
[[annotations]]
path = "docs/**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The API descriptions under MIT, so that other clients may generate code from them (generated by `kernoid openapi`
# and `kernoid graphql-schema`; in docs/, where Jekyll reads them).
[[annotations]]
path = ["docs/_data/openapi.json", "docs/api/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "MIT"

# The web SDK and login UI are MIT (decided for first-party apps): only the protocol connects them to the server.
[[annotations]]
path = ["web/**/package.json", "web/pnpm-lock.yaml", "web/**/tsconfig*.json", "web/login/public/manifest.webmanifest", "web/app/public/manifest.webmanifest",
        "web/app/src/admin/api-types.ts"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "MIT"

# The terminal app and the end-to-end library are MIT as well (first-party; Cargo workspaces of their own, apps/tui
# and apps/e2e).
[[annotations]]
path = ["apps/tui/Cargo.lock", "apps/tui/.gitignore", "apps/e2e/Cargo.lock", "apps/e2e/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G. and the kernoid contributors"
SPDX-License-Identifier = "MIT"

# Copies of the artwork from kernoid/brand – kept as they are, under its licence.
[[annotations]]
path = ["docs/assets/**", "web/login/public/*.svg", "web/login/public/*.png", "web/app/public/*.svg", "web/app/public/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "falkOSS – Falcon Lake Open Source Software gUG (haftungsbeschränkt) i. G."
SPDX-License-Identifier = "CC-BY-ND-4.0"

# Requests and responses from Stalwart's dav-proto tests, taken over with the protocol code (RFC 0004, 1).
[[annotations]]
path = "crates/kernoid-dav/resources/**"
precedence = "override"
SPDX-FileCopyrightText = "2020 Stalwart Labs LLC <hello@stalw.art>"
SPDX-License-Identifier = "AGPL-3.0-only"
