# SPDX-License-Identifier: MIT
# Originals by their hash – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-blob"
description = "Originals stored by their hash, in memory, in a folder or in S3 – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["content-addressed", "storage", "s3", "sha256", "kernoid"]
categories = ["filesystem", "database"]

[lints]
workspace = true

[features]
# Originals in object storage (`objects`): in memory, and what further features add.
object = ["dep:futures-util", "dep:tokio", "dep:bytes"]
# Originals in S3 and S3-compatible storage (Garage, MinIO, Ceph) – kernoid's own client (`objects::s3`): reqwest with
# rustls on AWS-LC and the system's trust store, post-quantum key exchange preferred (RFC 0006, 2).
s3 = ["object", "dep:reqwest", "dep:rustls", "dep:hmac", "dep:jiff", "tokio/time"]

[dependencies]
bytes = { version = "1.11.0", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"], optional = true }
hmac = { version = "0.13.0", optional = true }
jiff = { version = "1.0.1", optional = true }
kernoid-base = { version = "0.5.1", path = "../base" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"], optional = true }
# Named only for its feature: prefer the post-quantum key exchange X25519MLKEM768 (RFC 0006, 2).
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"], optional = true }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"], optional = true }

[package.metadata.docs.rs]
all-features = true
