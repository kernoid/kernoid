# SPDX-License-Identifier: MIT
# Part of kernoid's app kit (RFC 0011): MIT. Dependencies are exact, as in kernoid's apps, and at least two weeks old
# when taken; the packages of the kit refer to each other by path – an app overrides them all at once.
name: kernoid_ui
description: "kernoid's design system for Flutter, on the widgets layer: no Material, no Cupertino"
version: 0.5.0
publish_to: 'none'
repository: https://github.com/kernoid/kernoid

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  kernoid_l10n:
    path: ../kernoid_l10n
  intl: any
  lucide_icons_flutter: 4.0.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # kernoid's look: IBM Plex (assets/fonts, OFL-1.1); pages name it through KFont, as this package's.
  fonts:
    - family: Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
