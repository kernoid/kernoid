# SPDX-License-Identifier: MIT
# The Rust side of kernoid's apps (RFC 0011, 2): the crate in rust/ (on the kit's crates, by path) and the Dart code
# flutter_rust_bridge generates from it (lib/src/rust/). No native build here: kernoid_native builds the crate into
# kernoid's app, a program's own package builds its crate on this one into its app (RFC 0011, 4).
name: kernoid_bridge
description: "The Rust side of kernoid's apps: the kit's SDK, called from Dart"
version: 0.6.0
publish_to: 'none'
repository: https://github.com/kernoid/kernoid

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_lints: 6.0.0

