# SPDX-License-Identifier: MIT
# The Rust side of kernoid's apps (RFC 0011, 2): the crate in rust/ (on the kit's crates, by path), the Dart code
# flutter_rust_bridge generates from it (lib/src/rust/), and cargokit (cargokit/, MIT OR Apache-2.0) to build it for
# every platform – an FFI plugin.
name: kernoid_bridge
description: "The Rust side of kernoid's apps: the kit's SDK, called from Dart"
version: 0.4.0
publish_to: 'none'
repository: https://github.com/kernoid/kernoid

environment:
  sdk: ^3.14.0
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
