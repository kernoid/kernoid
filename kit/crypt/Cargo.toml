# SPDX-License-Identifier: MIT
# End-to-end encryption of a space – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-crypt"
description = "End-to-end encryption of a space: members, keys, the member list, envelopes – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["e2ee", "hpke", "ed25519", "encryption", "kernoid"]
categories = ["cryptography"]

[lints]
workspace = true

[dependencies]
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc", "zeroize"] }
ml-kem = { version = "0.2.3", features = ["deterministic"] }
sha3 = "0.10.9"
x25519-dalek = "3.0.0"
kernoid-base = { version = "0.5.1", path = "../base" }
kernoid-log = { version = "0.5.1", path = "../log" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
