# SPDX-License-Identifier: MIT
# kernoid's Rust SDK: the protocols of kernoid for clients – JMAP for mail, files, calendars, contacts and principals,
# push, the end-to-end encryption of RFC 0006 on kernoid-e2e, finding a server through DNS, iCalendar and vCard files.
# Async on tokio. Part of the kit (MIT, RFC 0008): apps under any licence may use it, and it reaches no server code.
# Its requirements are minimum versions (it is a library for others); the kit's Cargo.lock pins them, each at least
# two weeks old when taken (`../tui/scripts/check-age.py --dir=kit`).
[package]
name = "kernoid-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "kernoid's protocols for clients: JMAP mail, files, calendars, contacts, push and end-to-end encryption"
keywords = ["kernoid", "jmap", "mail", "webdav", "openpgp"]
categories = ["api-bindings", "email"]
homepage.workspace = true
readme = "README.md"
exclude = ["scripts/", "tests/"]

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
# The PKCE verifier and state of a login (oidc).
getrandom = "0.3.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
iana-time-zone = "0.1.65"
# Dates and times, with the time zones of the system (Unlicense OR MIT) – in place of chrono (RUSTSEC-2026-0543).
jiff = "1.0.1"
# End-to-end encryption (RFC 0006): keys, PGP/MIME, building and reading mail in the client – kernoid's own library
# (MIT), shared with the web app and the server.
kernoid-e2e = { version = "0.5.1", path = "../e2e" }
# iCalendar and vCard files, JSCalendar and JSContact – kernoid's own library (MIT), the one the server stores with.
kernoid-pim = { version = "0.5.1", path = "../pim" }
# Vaults on spaces (RFC 0010, 5): the foundation's streams, kept on the device in SQLite.
kernoid-base = { version = "0.5.1", path = "../base" }
kernoid-crypt = { version = "0.5.1", path = "../crypt" }
kernoid-spaces = { version = "0.5.1", path = "../spaces" }
kernoid-vault = { version = "0.5.1", path = "../vault" }
# HTTPS with rustls on AWS-LC and the system's trust store (rustls-platform-verifier).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }
# Named only for its feature: prefer the post-quantum key exchange X25519MLKEM768 (RFC 0006, 2).
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.3", features = ["fs", "io-util", "net", "rt", "time"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["io"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Argon2 (unlocking the key) and the post-quantum algorithms are slow without optimisation; tests build dependencies

[lints]
workspace = true
