# SPDX-License-Identifier: MIT
# A device's replica of its spaces – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-replica"
description = "A device's replica of its spaces, synchronised through a relay, end to end encrypted – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sync", "e2ee", "local-first", "replica", "kernoid"]
categories = ["network-programming", "cryptography"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
kernoid-base = { version = "0.5.0", path = "../base" }
kernoid-blob = { version = "0.5.0", path = "../blob" }
kernoid-crypt = { version = "0.5.0", path = "../crypt" }
kernoid-log = { version = "0.5.0", path = "../log" }
kernoid-space-store = { version = "0.5.0", path = "../space-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# HTTPS to the relay: rustls on AWS-LC, post-quantum key exchange preferred, the system's trust store (RFC 0006, 2) –
# not ureq's default of ring and webpki-roots.
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"], optional = true }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier", "gzip"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# The browser's clock (`now_ms`).
js-sys = "0.3.91"

[features]
default = ["native"]
# Reaching relays through ureq; without it, the program gives a transport of its own (a web page's worker).
native = ["dep:rustls", "dep:ureq"]

[dev-dependencies]
serde_json = "1.0.154"
