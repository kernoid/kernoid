# SPDX-License-Identifier: MIT
# A device's replica of its spaces – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-replica"
description = "A device's replica of its spaces, synchronised through a relay, end to end encrypted – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sync", "e2ee", "local-first", "replica", "kernoid"]
categories = ["network-programming", "cryptography"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
kernoid-base = { version = "0.5.0", path = "../base" }
kernoid-blob = { version = "0.5.0", path = "../blob" }
kernoid-crypt = { version = "0.5.0", path = "../crypt" }
kernoid-log = { version = "0.5.0", path = "../log" }
kernoid-space-store = { version = "0.5.0", path = "../space-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.4.2"

[dev-dependencies]
serde_json = "1.0.154"
