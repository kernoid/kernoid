# SPDX-License-Identifier: MIT
# End-to-end encryption of kernoid's apps (RFC 0006): OpenPGP keys and their protected copies, encrypting and
# decrypting, PGP/MIME with header protection – on rpgp. Part of the kit (MIT, RFC 0008): the web app uses it as
# WebAssembly, the apps and the terminal app as a library, and the server for encryption on arrival – one
# implementation everywhere. Since the server's workspace builds it too, its requirements
# are minimum versions, not exact ones – each workspace's Cargo.lock pins them; versions are at least two weeks old when
# taken (`../tui/scripts/check-age.py --dir=kit`).
[package]
name = "kernoid-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end encryption of kernoid's apps: OpenPGP with post-quantum keys, PGP/MIME"
homepage.workspace = true
readme = "README.md"
exclude = ["scripts/", "tests/"]
keywords = ["kernoid", "openpgp", "e2e", "post-quantum", "pgp-mime"]
categories = ["cryptography", "email"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The bindings for the web app (`wasm-bindgen`), built with `scripts/build-wasm.sh`.
wasm = ["dep:wasm-bindgen", "pgp/wasm"]

[dependencies]
base64 = "0.22.1"
# Mail parsed as the server parses it: kernoid's own (the kit).
kernoid-mime = { version = "0.6.0", path = "../mime" }
# OpenPGP (RFC 9580) with its post-quantum algorithms (RFC 9980) – MIT OR Apache-2.0.
pgp = { version = "0.21.0", default-features = false, features = ["pqc"] }
rand = "0.8.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
wasm-bindgen = { version = "0.2.129", optional = true }

[lints]
workspace = true

