# SPDX-License-Identifier: MIT
# kernoid-sync: a folder kept in step with a file store of kernoid (RFC 0005) – changes, transfers, conflicts and the
# local state in SQLite; part of the kit (MIT, RFC 0008) beside kernoid-client, which it talks through. Its
# requirements are minimum versions, the kit's Cargo.lock pins them, each at least two weeks old when taken
# (`../tui/scripts/check-age.py --dir=kit`).
[package]
name = "kernoid-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "kernoid's file sync: a folder kept in step with a file store over JMAP"
keywords = ["kernoid", "jmap", "sync", "files"]
categories = ["filesystem", "network-programming"]
homepage.workspace = true
readme = "README.md"
exclude = ["scripts/", "tests/"]

[dependencies]
# Dates and times (Unlicense OR MIT) – in place of chrono (RUSTSEC-2026-0543).
jiff = "1.0.1"
kernoid-client = { version = "0.5.0", path = "../client" }
# SQLite built in (its code is in the public domain), so that every platform has the same.
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.3", features = ["fs"] }

[dev-dependencies]
kernoid-e2e = { version = "0.5.0", path = "../e2e" }
tokio = { version = "1.53.3", features = ["fs", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
