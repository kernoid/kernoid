# SPDX-License-Identifier: MIT
# A device's spaces in SQLite – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-space-store"
description = "A device's spaces in SQLite – events, member records, settings, what was sent – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sqlite", "event-log", "local-first", "kernoid"]
categories = ["database"]

[lints]
workspace = true

[features]
# The database encrypted as a whole: SQLCipher (BSD-3-Clause) with OpenSSL (Apache-2.0) built in, instead of SQLite.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
kernoid-base = { version = "0.4.0", path = "../base" }
kernoid-crypt = { version = "0.4.0", path = "../crypt" }
kernoid-log = { version = "0.4.0", path = "../log" }
# SQLite built in, 3.54.1 – the fix of RUSTSEC-2026-0459 that SQLCipher has too (one version for the kit: kernoid-sync
# takes the same).
rusqlite = { version = "0.42.0", features = ["bundled"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
