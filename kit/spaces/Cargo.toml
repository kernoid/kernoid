# SPDX-License-Identifier: MIT
# A device's spaces – its store in SQLite and their synchronisation through a relay – part of kernoid's foundation
# (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f, the maintainer holds the rights); until
# 0.5.0 the crates kernoid-replica and kernoid-space-store. In the kit (MIT): the apps of every program built on kernoid
# use it on the device.
[package]
name = "kernoid-spaces"
description = "A device's end-to-end encrypted spaces: their store in SQLite and their synchronisation through a relay – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["sync", "e2ee", "local-first", "sqlite", "kernoid"]
categories = ["network-programming", "cryptography", "database"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
kernoid-base = { version = "0.7.0", path = "../base" }
kernoid-blob = { version = "0.7.0", path = "../blob" }
kernoid-crypt = { version = "0.7.0", path = "../crypt" }
kernoid-log = { version = "0.7.0", path = "../log" }
# SQLite built in, 3.54.1 – the fix of RUSTSEC-2026-0459 that SQLCipher has too (one version for the kit: kernoid-sync
# takes the same).
rusqlite = { version = "0.42.0", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# HTTPS to the relay through the SDK's HTTP client (one stack in the kit): rustls on AWS-LC, post-quantum key exchange
# preferred, the system's trust store (RFC 0006, 2); its requests on a runtime of the transport's own.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "tls12"], optional = true }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "net"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# The browser's clock (`now_ms`).
js-sys = "0.3.91"

[features]
default = ["native", "sqlite"]
# Reaching relays through reqwest; without it, the program gives a transport of its own (a web page's worker).
native = ["dep:reqwest", "dep:rustls", "dep:tokio"]
# The store encrypted as a whole: SQLCipher (BSD-3-Clause) with OpenSSL (Apache-2.0) built in, instead of SQLite.
# A device's store in SQLite (`store::Store`); without it, a program brings its own `StreamBackend` – a server's on
# PostgreSQL (kernoid-relay's feature `node`) – and keeps SQLite out of its build.
sqlite = ["dep:rusqlite"]
sqlcipher = ["sqlite", "rusqlite/bundled-sqlcipher-vendored-openssl"]
# The store as bytes and back (`Store::to_bytes`, `from_bytes`), for a store kept elsewhere than in a file.
serialize = ["sqlite", "rusqlite/serialize"]

[dev-dependencies]
serde_json = "1.0.154"

# The tests keep their devices in SQLite.
[[test]]
name = "streams"
required-features = ["sqlite"]

[[test]]
name = "server"
required-features = ["sqlite"]
