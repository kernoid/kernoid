# SPDX-License-Identifier: MIT
# The event log of a space – part of kernoid's foundation (RFC 0010), taken over from aktujo's core at aktujo 0.4.1 (commit fdf967f,
# the maintainer holds the rights). In the kit (MIT): the apps of every program built on kernoid use it on the device.
[package]
name = "kernoid-log"
description = "The event log of a space: events of any kind, hybrid logical clocks, chains per device – part of kernoid's foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["event-log", "hlc", "local-first", "sync", "kernoid"]
categories = ["data-structures", "database"]

[lints]
workspace = true

[dependencies]
kernoid-base = { version = "0.7.0", path = "../base" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
