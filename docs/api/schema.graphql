"""
Every query: sessions and login, and administration.
"""
type QueryRoot {
	"""
	The instance reached under the host of this request; null if there is none.
	"""
	instance: Instance
	"""
	The name and version of this kernoid.
	"""
	version: Version!
	"""
	A pending OpenID Connect auth request – for the login UI to show who is asking.
	"""
	authRequest(id: String!): AuthRequest!
	"""
	The second factors of the session's account.
	"""
	secondFactors: SecondFactors!
	"""
	The passkeys of the session's account.
	"""
	passkeys: [Passkey!]!
	"""
	The session of the bearer token.
	"""
	session: Session!
	"""
	Where an address logs in: the identity provider its domain is routed to, if any.
	"""
	loginOptions(address: String!): IdentityProviderSummary
	"""
	The applications the bearer token's account agreed to.
	"""
	myConsents: [Consent!]!
	"""
	The valid sessions of the bearer token's account, newest first.
	"""
	mySessions: [SessionSummaryObject!]!
	"""
	The tenant administered (needs `directory.read`).
	"""
	tenant: Tenant!
	"""
	The tenant's verified domains as mail domains: the DNS records to publish and whether they are published
	(reads DNS, changes nothing).
	"""
	mailDns: [MailDns!]!
	"""
	The caller's permissions for the tenant administered.
	"""
	permissions: Permissions!
	"""
	The tenant's accounts (needs `directory.read`).
	"""
	accounts: [AccountDetails!]!
	account(id: String!): AccountDetails!
	"""
	An account's addresses, the primary one first, then its aliases (needs `directory.read`).
	"""
	accountAddresses(id: String!): [AccountAddress!]!
	"""
	An account's valid sessions (needs `accounts.manage`).
	"""
	accountSessions(account: String!): [SessionSummaryObject!]!
	"""
	The applications an account agreed to (needs `accounts.manage`).
	"""
	accountConsents(account: String!): [Consent!]!
	"""
	What happened in the tenant (`scope` "tenant", needs `directory.read`) or the instance ("instance", needs
	`instance.read`): the events, newest first; `before` is the `position` of the last entry of the page before.
	"""
	auditLog(scope: String, before: Int, limit: Int, aggregateType: String, aggregateId: String): [AuditEntryObject!]!
	"""
	The tenant's groups (needs `directory.read`).
	"""
	groups: [Group!]!
	"""
	The tenant's roles – built in and its own – and who holds them (needs `directory.read`).
	"""
	roles: Roles!
	"""
	The tenant's projects (needs `directory.read`).
	"""
	projects: [Project!]!
	project(id: String!): Project!
	"""
	Who holds which role of a project – for a granted project only the tenant's own (needs `directory.read`).
	"""
	projectAuthorizations(project: String!): [ProjectAuthorization!]!
	"""
	The tenants a project is granted to (needs `directory.read`).
	"""
	projectGrants(project: String!): [ProjectGrant!]!
	"""
	The projects other tenants have granted to this one (needs `directory.read`).
	"""
	grantedProjects: [ProjectGrant!]!
	"""
	The tenant's applications (needs `directory.read`).
	"""
	applications: [Application!]!
	application(id: String!): Application!
	"""
	The instance with all its domains (needs `instance.read`).
	"""
	instanceDetails: InstanceDetails!
	"""
	The instance's tenants (needs `instance.read`).
	"""
	tenants: [TenantSummary!]!
	"""
	The instance roles and who holds them (needs `instance.read`).
	"""
	instanceRoles: InstanceRoles!
	"""
	The tenant's identity providers (needs `directory.read`).
	"""
	identityProviders: [IdentityProviderObject!]!
	identityProvider(id: String!): IdentityProviderObject!
	"""
	The external identities linked to an account (needs `directory.read`).
	"""
	accountLinks(account: String!): [AccountLink!]!
	"""
	The tenant's SCIM tokens (needs `directory.read`).
	"""
	scimTokens: [ScimToken!]!
	"""
	The instance's signing keys (needs `instance.read`).
	"""
	signingKeys: [SigningKey!]!
	"""
	kernoid's SAML keys of the instance (needs `instance.read`).
	"""
	samlKeys: [SamlKey!]!
	"""
	An account's mail: usage, quota and mailboxes (needs `accounts.manage`).
	"""
	accountMail(account: String!): MailOverview!
	"""
	The tenant's default mail quota (needs `directory.read`).
	"""
	tenantMailQuota: Int
	"""
	The tenant's mail retention (needs `directory.read`).
	"""
	mailRetention: MailRetention!
	"""
	A mailbox of an account (by id or role) as mbox (needs `accounts.manage`); for large mailboxes use the REST
	route, which streams.
	"""
	exportMailbox(account: String!, mailbox: String!): String!
	"""
	Who may use an account's mail (needs `accounts.manage`).
	"""
	mailAccess(account: String!): [MailGrantObject!]!
	"""
	An account's Sieve scripts (needs `accounts.manage`).
	"""
	sieveScripts(account: String!): [SieveScriptObject!]!
	"""
	The queue of outgoing mail of the instance's tenants (needs `instance.read`).
	"""
	mailQueue(limit: Int! = 100): [QueuedRecipientObject!]!
	"""
	The mail shared with the session's account.
	"""
	sharedMail: [SharedStoreObject!]!
	"""
	Who may use the session's account's mail.
	"""
	myMailAccess: [MailGrantObject!]!
	"""
	What registering offers at this instance.
	"""
	registrationOptions: RegistrationOptions!
	"""
	The providers offered to everyone on the login page.
	"""
	loginProviders: [IdentityProviderSummary!]!
	"""
	What a provider login that found an account with its verified address proposes; does not use the code up.
	"""
	linkProposal(login: String!): LinkProposal!
	"""
	The services of an account (needs `directory.read`).
	"""
	accountServices(account: String!): [AccountService!]!
	"""
	How the tenant's accounts log in (needs `directory.read`).
	"""
	loginPolicy: LoginPolicy!
	"""
	Whether people may register with the tenant, and on which domains (needs `directory.read`).
	"""
	tenantRegistration: TenantRegistration!
	"""
	The tenant's rules for each service (needs `directory.read`).
	"""
	servicePolicies: [ServicePolicyObject!]!
	"""
	An account's calendars and address books (needs `accounts.manage`).
	"""
	collections(account: String!): [CollectionObject!]!
	"""
	Who may use an account's calendars and address books (needs `accounts.manage`).
	"""
	collectionAccess(account: String!): [CollectionGrantObject!]!
	"""
	A calendar as iCalendar or an address book as vCard (needs `accounts.manage`).
	"""
	exportCollection(account: String!, collection: String!): String!
	"""
	The session's calendars and address books, and those shared with it.
	"""
	myCollections: [CollectionObject!]!
	"""
	Who may use a calendar or address book the session owns or administers.
	"""
	myCollectionAccess(owner: String!, collection: String!): [CollectionGrantObject!]!
	"""
	An account's files: usage and quota (needs `accounts.manage`).
	"""
	accountFiles(account: String!): FilesOverview!
	"""
	The tenant's default files quota (needs `directory.read`).
	"""
	tenantFilesQuota: Int
	"""
	The tenant's drives (needs `directory.read`).
	"""
	drives: [DriveObject!]!
	"""
	Who may use an account's files or a drive (needs `accounts.manage`).
	"""
	fileAccess(account: String!): [FileGrantObject!]!
}

type QueuedRecipientObject {
	message: String!
	address: String!
	status: String!
	attempts: Int!
	nextAttemptAt: DateTime!
