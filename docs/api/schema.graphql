	grantInstanceRole(role: String!, principalKind: String!, principalId: String!): Boolean!
	"""
	Takes an instance role back; the last `instance_admin` stays.
	"""
	revokeInstanceRole(role: String!, principalKind: String!, principalId: String!): Boolean!
	"""
	Creates a signing key (needs `instance.manage`); returns its id.
