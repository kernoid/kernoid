type Account {
	id: String!
	tenant: String!
	address: String!
	displayName: String!
}

"""
An address of an account.
"""
type AccountAddress {
	address: String!
	"""
	The primary address – the login name; the others are aliases.
	"""
	primary: Boolean!
}

type AccountDetails {
	id: String!
	tenant: String!
	address: String!
	displayName: String!
	active: Boolean!
	"""
	A shared mailbox: nobody logs in as it.
	"""
	shared: Boolean!
	"""
	A drive: a file store of the tenant; nobody logs in as it.
	"""
	drive: Boolean!
}

type AccountLink {
	identityProvider: String!
	subject: String!
	createdAt: DateTime!
}

type AccountService {
	service: String!
	"""
	`on` or `requested`.
	"""
	state: String!
}

type Application {
	id: String!
	name: String!
	"""
	`confidential` or `public`.
	"""
	kind: String!
	project: String
	redirectUris: [String!]!
	postLogoutRedirectUris: [String!]!
	mfaRequired: Boolean!
	active: Boolean!
	options: ApplicationOptions!
}

type ApplicationCreated {
	id: String!
	"""
	For a confidential application: its secret, shown this once.
	"""
	clientSecret: String
}

"""
What an application may do beyond the basic flow, and how it learns of logouts.
"""
type ApplicationOptions {
	"""
	`opaque` or `jwt` (RFC 9068).
	"""
	accessTokenFormat: String!
	"""
	May ask for `offline_access`, with the person's consent.
	"""
	offlineAccess: Boolean!
	"""
	Asks the person to agree before the first login.
	"""
	consentRequired: Boolean!
	backchannelLogoutUri: String
	frontchannelLogoutUri: String
}

"""
An event of the audit log.
"""
type AuditEntryObject {
	position: Int!
	aggregateType: String!
	aggregateId: String!
	sequence: Int!
	eventType: String!
	payload: JSON!
	"""
	An account id, `system`, `operator` or a service.
	"""
	creator: String!
	createdAt: DateTime!
}

type AuthRequest {
	id: String!
	"""
	The name of the application asking.
	"""
	application: String!
	scopes: [String!]!
	"""
	`none`, `login`, `consent`, `select_account` – what the login UI must respect.
	"""
	prompt: [String!]!
	"""
	The session may be at most this many seconds old.
	"""
	maxAge: Int
	expiresAt: DateTime!
}

type CollectionGrantObject {
	kind: String!
	collection: String!
	"""
	`account` or `group`.
	"""
	granteeKind: String!
	granteeId: String!
	granteeName: String!
	level: String!
}

type CollectionImportResult {
	stored: Int!
	"""
	UIDs of the objects not stored.
	"""
	refused: [String!]!
}

type CollectionObject {
	owner: String!
	ownerName: String!
	"""
	`calendar` or `addressbook`.
	"""
	kind: String!
	id: String!
	name: String!
	color: String
	isDefault: Boolean!
	"""
	The caller's level: `freebusy`, `read`, `rsvp`, `write` or `admin` (an owner's).
	"""
	level: String!
}

"""
What an account agreed an application may have.
"""
type Consent {
	application: String!
	applicationName: String!
	scopes: [String!]!
	grantedAt: DateTime!
}

type CreatedSession {
	id: String!
	"""
	The session token: shown this once, sent as `Authorization: Bearer <token>`.
	"""
	token: String!
	expiresAt: DateTime!
	account: Account!
	"""
	After a password login: keep it for this address and send it with the next login (`deviceToken`).
	"""
	deviceToken: String
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

"""
A drive: a file store of the tenant, reached through grants.
"""
type DriveObject {
	id: String!
	name: String!
	active: Boolean!
}

type ExchangedIdpLogin {
	session: CreatedSession!
	"""
	The auth request the login was for – finish it next.
	"""
	authRequest: String
}

"""
A grant on an account's files or a drive.
"""
type FileGrantObject {
	"""
	`account` or `group`.
	"""
	granteeKind: String!
	granteeId: String!
	granteeName: String!
	"""
	A directory; null: the whole store.
	"""
	node: String
	"""
	Letters of `randws`.
	"""
	rights: String!
}

"""
An account's files as its administrators see them.
"""
type FilesOverview {
	usedBytes: Int!
	"""
	The account's own quota; null when the tenant's default holds.
	"""
	quota: Int
	"""
	What holds: the account's own quota or the tenant's default; null for no limit.
	"""
	effectiveQuota: Int
}

type Group {
	id: String!
	name: String!
	"""
	Account ids.
	"""
	members: [String!]!
	"""
	Addresses mail to the group arrives at; it goes to every member.
	"""
	addresses: [String!]!
	"""
	The members may send from these addresses.
	"""
	membersSendAs: Boolean!
}

type IdentityProviderObject {
	id: String!
	name: String!
	kind: String!
	issuer: String!
	clientId: String!
	scopes: [String!]!
	domains: [String!]!
	autoCreate: Boolean!
	autoLink: Boolean!
	hasSecret: Boolean!
	active: Boolean!
	"""
	Register this at the provider: the redirect URI (OpenID Connect) or the ACS URL (SAML).
	"""
	redirectUri: String!
	samlSsoUrl: String
	samlCertificates: [String!]!
	samlEmailAttribute: String
	samlNameAttribute: String
	samlSignRequests: Boolean!
	samlSloUrl: String
	"""
	The display name follows the provider's at every login.
	"""
	syncProfile: Boolean!
	"""
	Offered to everyone on the login page; creates accounts where the tenant allows registration.
	"""
	register: Boolean!
	"""
	Serves the domains of every tenant of the instance.
	"""
	instanceWide: Boolean!
}

type IdentityProviderSummary {
	id: String!
	name: String!
}

type Instance {
	id: String!
	name: String!
	primaryDomain: String!
}

type InstanceDetails {
	id: String!
	name: String!
	primaryDomain: String!
	domains: [String!]!
	"""
	The instance's own login UI; without one, kernoid's at `/login`.
	"""
	loginUiUrl: String
	"""
	The WebAuthn RP ID its passkeys are bound to.
	"""
	passkeyRpId: String!
}

type InstanceRole {
	name: String!
	permissions: [String!]!
	tenantPermissions: [String!]!
	builtin: Boolean!
}

type InstanceRoles {
	roles: [InstanceRole!]!
	assignments: [RoleAssignment!]!
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

type LinkProposal {
	email: String!
	provider: String!
	mayRegister: Boolean!
}

type LoginPolicy {
	usernames: Boolean!
	emailLogin: Boolean!
}

type MailDns {
	domain: String!
	records: [RecordCheck!]!
}

type MailGrantObject {
	"""
	`account` or `group`.
	"""
	granteeKind: String!
	granteeId: String!
	granteeName: String!
	"""
	Null: the whole store.
	"""
	mailbox: String
	"""
	IMAP ACL rights (RFC 4314).
	"""
	rights: String!
	sendAs: Boolean!
}

type MailOverview {
	"""
	A shared mailbox: nobody logs in as it.
	"""
	shared: Boolean!
	usedBytes: Int!
	"""
	The account's own quota; null when the tenant's default holds.
	"""
	quota: Int
	"""
	What holds; null for no limit.
	"""
	effectiveQuota: Int
	mailboxes: [MailboxObject!]!
}

type MailRetention {
	"""
	Days emails stay in the accounts' Trash; null keeps them.
	"""
	trashDays: Int
	"""
	Days emails stay in the accounts' Junk; null keeps them.
	"""
	junkDays: Int
}

type MailboxObject {
	id: String!
	parentId: String
	name: String!
	role: String
	totalEmails: Int!
	unreadEmails: Int!
}

type MboxImportResult {
	imported: Int!
	"""
	Messages refused: not a message, too large, over the quota.
	"""
	failed: Int!
}

type MutationRoot {
	"""
	Logs in: checks address and password at the instance of this host and creates a session.
	"""
	createSession(address: String!, password: String!, lifetimeSeconds: Int, deviceToken: String): CreatedSession!
	"""
	Finishes an auth request with the session of the bearer token; returns the URL to send the browser to. With
	`CONSENT_REQUIRED`, show what the application asks for and finish again with `consent: true`.
	"""
	finishAuthRequest(id: String!, consent: Boolean): String!
	"""
	Withdraws one's own consent to an application, and the application's tokens – offline access included.
	"""
	revokeMyConsent(application: String!): Boolean!
	"""
	Ends an auth request without a login (`login_required`, `consent_required`, `interaction_required`,
	`account_selection_required`, `access_denied`); returns the URL that tells the application.
	"""
	declineAuthRequest(id: String!, error: String!): String!
	"""
	Starts a login with a passkey – no address, no password.
	"""
	startPasskeyLogin: PasskeyChallenge!
	"""
	Finishes a passkey login and creates a session.
	"""
	finishPasskeyLogin(challengeId: String!, credential: JSON!, lifetimeSeconds: Int): CreatedSession!
	"""
	Checks a TOTP code as a further check of the current session.
	"""
	checkTotp(code: String!): Session!
	"""
	Starts a passkey check of the current session.
	"""
	startPasskeyCheck: PasskeyChallenge!
	"""
	Finishes a passkey check of the current session.
	"""
	finishPasskeyCheck(challengeId: String!, credential: JSON!): Session!
	"""
	Proposes a TOTP secret for the session's account (needs a recent session).
	"""
	startTotp: TotpSetup!
	"""
	Confirms the proposed TOTP secret with a first code.
	"""
	confirmTotp(code: String!): Boolean!
	"""
	Generates new recovery codes (needs a recent session); earlier ones stop working. Shown this once.
	"""
	generateRecoveryCodes: [String!]!
	"""
	Uses a recovery code as a further check of the current session.
	"""
	checkRecoveryCode(code: String!): Session!
	"""
	Removes TOTP from the session's account.
	"""
	removeTotp: Boolean!
	"""
	Starts registering a passkey for the session's account (needs a recent session).
	"""
	startPasskeyRegistration: PasskeyChallenge!
	"""
	Finishes registering a passkey; returns its id.
	"""
	finishPasskeyRegistration(challengeId: String!, name: String!, credential: JSON!): String!
	"""
	Removes a passkey of the session's account.
	"""
	removePasskey(id: String!): Boolean!
	"""
	Logs out: ends the session of the bearer token.
	"""
	terminateSession: Boolean!
	"""
	Logs out like `terminateSession`; if the session came from a SAML provider with single logout, returns where
	to send the browser next, to log out there too.
	"""
	logout: String
	"""
	Starts a login at an identity provider; returns where to send the browser.
	"""
	startIdpLogin(identityProvider: String!, authRequest: String, loginHint: String): String!
	"""
	Exchanges the result of a login at an identity provider (`<login id>.<code>`) for a session – once.
	"""
	exchangeIdpLogin(login: String!, lifetimeSeconds: Int): ExchangedIdpLogin!
	"""
	Ends a session of the bearer token's own account.
	"""
	terminateMySession(id: String!): Boolean!
	"""
	Changes the own password: needs a recent session and the current password; other sessions end.
	"""
	changePassword(currentPassword: String!, newPassword: String!): Boolean!
	"""
	Changes the own display name.
	"""
	updateProfile(displayName: String!): Boolean!
	renameTenant(name: String!): Boolean!
	"""
	Sets whether every login to an application of the tenant needs a second factor, and how many days accounts
	without one may still log in (`mfaGraceDays`, 0 to 365); needs `policies.manage`.
	"""
	setTenantPolicy(mfaRequired: Boolean!, mfaGraceDays: Int): Tenant!
	"""
	Switches a compiled-in module on or off for the tenant (needs `tenant.manage`).
	"""
	setTenantModule(module: String!, enabled: Boolean!): Boolean!
	"""
	Claims a mail domain; returns the TXT record that proves it (needs `domains.manage`).
	"""
	addTenantDomain(domain: String!): TenantDomain!
	"""
	Verifies a domain by its TXT record (needs `domains.manage`), or without DNS with `trust` (needs
	`tenants.manage`).
	"""
	verifyTenantDomain(domain: String!, trust: Boolean! = false): Boolean!
	"""
	Starts a change of a verified mail domain's DKIM key (needs `domains.manage`); `algorithm` is `rsa` (the
	default) or `ed25519`. Returns the new key's selector; `mailDns` shows its record.
	"""
	rotateDkimKey(domain: String!, algorithm: String): String!
	removeTenantDomain(domain: String!): Boolean!
	"""
	Creates an account (needs `accounts.manage`); returns its id.
	"""
	addAccount(address: String!, displayName: String!, password: String): String!
	"""
	Changes an account's display name, login name or active state (needs `accounts.manage`).
	"""
	updateAccount(id: String!, displayName: String, primaryAddress: String, active: Boolean): Boolean!
	addAlias(account: String!, address: String!): Boolean!
	removeAlias(account: String!, address: String!): Boolean!
	"""
	Sets an account's password and ends its sessions (needs `accounts.manage` and every permission it holds).
	"""
	setAccountPassword(account: String!, password: String!): Boolean!
	"""
	Removes all second factors of an account (needs `accounts.manage` and every permission it holds).
	"""
	resetSecondFactors(account: String!): Boolean!
	terminateAccountSession(account: String!, session: String!): Boolean!
	"""
	Creates a group (needs `groups.manage`); returns its id.
	"""
	addGroup(name: String!): String!
	renameGroup(id: String!, name: String!): Boolean!
	"""
	Lets the group's members send from its addresses, or stops it (needs `groups.manage`).
	"""
	setGroupSendAs(id: String!, enabled: Boolean!): Boolean!
	"""
	Removes a group; refused while it holds roles.
	"""
	removeGroup(id: String!): Boolean!
	"""
	Adds an account to a group; for a group holding roles also the permission to assign them.
	"""
	addGroupMember(group: String!, account: String!): Boolean!
	removeGroupMember(group: String!, account: String!): Boolean!
	"""
	Gives a group an address on a verified domain of the tenant; mail to it goes to every member.
	"""
	addGroupAddress(group: String!, address: String!): Boolean!
	removeGroupAddress(group: String!, address: String!): Boolean!
	"""
	Defines a role of the tenant's own, or changes its permissions (needs `roles.manage`).
	"""
	defineRole(name: String!, permissions: [String!]!): Boolean!
	deleteRole(name: String!): Boolean!
	"""
	Assigns a role to an account or group of the tenant (needs `roles.manage`).
	"""
	grantRole(role: String!, principalKind: String!, principalId: String!): Boolean!
	"""
	Takes a role back; the tenant's last `tenant_admin` assignment cannot be revoked.
	"""
	revokeRole(role: String!, principalKind: String!, principalId: String!): Boolean!
	"""
	Creates a project (needs `projects.manage`); returns its id.
	"""
	addProject(name: String!): String!
	"""
	Renames a project or changes its settings (needs `projects.manage`).
	"""
	updateProject(id: String!, name: String, roleAssertion: Boolean, roleCheck: Boolean): Project!
	"""
	Removes a project without applications and authorizations.
	"""
	removeProject(id: String!): Boolean!
	"""
	Adds a role to a project, or changes its display name and group (needs `projects.manage`).
	"""
	setProjectRole(project: String!, key: String!, displayName: String!, group: String): Boolean!
	removeProjectRole(project: String!, key: String!): Boolean!
	"""
	Gives an account or group a role of a project (needs `authorizations.manage`).
	"""
	grantProjectRole(project: String!, role: String!, principalKind: String!, principalId: String!): Boolean!
	revokeProjectRole(project: String!, role: String!, principalKind: String!, principalId: String!): Boolean!
	"""
	Grants a project to another tenant – by id or verified mail domain – with some of its roles (needs
	`projects.manage`).
	"""
	grantProject(project: String!, tenant: String!, roles: [String!]!): Boolean!
	"""
	Takes a grant back, once that tenant holds none of the project's roles.
	"""
	revokeProjectGrant(project: String!, tenant: String!): Boolean!
	"""
	Registers an application in a project (needs `applications.manage`).
	"""
	addApplication(project: String!, name: String!, kind: String!, redirectUris: [String!]!, postLogoutRedirectUris: [String!]! = []): ApplicationCreated!
	"""
	Changes an application (needs `applications.manage`).
	"""
	updateApplication(id: String!, name: String, project: String, redirectUris: [String!], postLogoutRedirectUris: [String!], active: Boolean): Application!
	"""
	Sets whether logins to one application need a second factor (needs `applications.manage`).
	"""
	setApplicationPolicy(id: String!, mfaRequired: Boolean!): Application!
	"""
	Sets an application's options (needs `applications.manage`): `accessTokenFormat` is `opaque` or `jwt`.
	"""
	setApplicationOptions(id: String!, accessTokenFormat: String, offlineAccess: Boolean, consentRequired: Boolean, backchannelLogoutUri: String, frontchannelLogoutUri: String): Application!
	"""
	Withdraws an account's consent to an application, and the application's tokens for it (needs
	`accounts.manage` and every permission the account holds).
	"""
	revokeConsent(account: String!, application: String!): Boolean!
	"""
	Replaces the secret of a confidential application; returns it, shown this once.
	"""
	newClientSecret(id: String!): String!
	"""
	Connects an identity provider (needs `identity_providers.manage`; with `instanceWide`, for every tenant of the
	instance, `instance.manage`); returns its id.
	"""
	addIdentityProvider(name: String!, issuer: String!, clientId: String! = "", clientSecret: String, scopes: [String!]! = [], domains: [String!]! = [], autoCreate: Boolean! = false, autoLink: Boolean! = false, syncProfile: Boolean! = false, register: Boolean! = false, instanceWide: Boolean! = false, saml: SamlInput): String!
	"""
	Changes an identity provider (needs `identity_providers.manage`).
	"""
	updateIdentityProvider(id: String!, name: String, issuer: String, clientId: String, scopes: [String!], domains: [String!], autoCreate: Boolean, autoLink: Boolean, syncProfile: Boolean, register: Boolean, active: Boolean, saml: SamlInput): Boolean!
	"""
	Sets the client secret, or removes it with null (needs `identity_providers.manage`).
	"""
	setIdentityProviderSecret(id: String!, clientSecret: String): Boolean!
	removeIdentityProvider(id: String!): Boolean!
	"""
	Whether kernoid reaches the provider as configured.
	"""
	checkIdentityProvider(id: String!): Boolean!
	"""
	Unlinks an external identity from an account (needs `accounts.manage`).
	"""
	unlinkAccount(account: String!, identityProvider: String!, subject: String!): Boolean!
	"""
