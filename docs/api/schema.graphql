"""
A DNS record a mail domain needs.
"""
type RecordCheck {
	"""
	`MX`, `SPF`, `DKIM` or `DMARC`.
	"""
	kind: String!
	name: String!
	"""
	`MX` or `TXT`.
	"""
	recordType: String!
	expected: String!
	found: [String!]!
	"""
	`ok`, `missing` or `different`.
	"""
	status: String!
}

type RegistrationOptions {
	"""
	People without an address of their own may register.
	"""
	open: Boolean!
	"""
	Domains on which new accounts may take an address – a mailbox.
	"""
	domains: [String!]!
	usernames: Boolean!
	"""
	kernoid can send the code; without it, registering works only with providers.
	"""
	byEmail: Boolean!
}

