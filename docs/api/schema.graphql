	"""
	revokeService(account: String!, service: String!): Boolean!
	"""
	Gives an account a username, or takes it away with null (needs `accounts.manage`).
	"""
	setUsername(account: String!, username: String): Boolean!
	"""
	Sets an account's contact address (needs `accounts.manage`).
	"""
	setContactEmail(account: String!, email: String, verified: Boolean! = false): Boolean!
	"""
	Sets how the tenant's accounts log in (needs `policies.manage`).
	"""
	setLoginPolicy(usernames: Boolean!, emailLogin: Boolean!): Boolean!
	"""
	Opens or closes registration and names its domains (needs `policies.manage`).
	"""
	setTenantRegistration(allowed: Boolean!, domains: [String!]! = []): Boolean!
	"""
	Sets who gets a service when an account is created, and whether it needs approval (needs `policies.manage`).
	"""
	setServicePolicy(service: String!, assign: String!, approval: Boolean!): Boolean!
	"""
	Names the tenant where people without an address of a tenant register (needs `instance.manage`).
	"""
	setRegistrationTenant(tenant: String): Boolean!
	"""
	Grants an account or a group a level on a calendar or address book (needs `accounts.manage`).
	"""
	setCollectionAccess(account: String!, collection: String!, granteeKind: String!, granteeId: String!, level: String!): Boolean!
	"""
	Removes a grant on a calendar or address book (needs `accounts.manage`).
	"""
	removeCollectionAccess(account: String!, collection: String!, granteeKind: String!, granteeId: String!): Boolean!
	"""
	Stores the events of an iCalendar file or the contacts of a vCard file (needs `accounts.manage`).
	"""
	importCollection(account: String!, collection: String!, content: String!): CollectionImportResult!
	"""
	Shares a calendar or address book the session owns or administers with an address or `$group`.
	"""
	shareCollection(owner: String!, collection: String!, grantee: String!, level: String!): Boolean!
	"""
	Stops sharing a calendar or address book with someone.
	"""
	unshareCollection(owner: String!, collection: String!, grantee: String!): Boolean!
	"""
	Sets an account's files quota; null for the tenant's default (needs `accounts.manage`).
	"""
	setFilesQuota(account: String!, bytes: Int): Boolean!
	"""
	Creates a drive of the tenant (needs `accounts.manage`); its id.
	"""
	addDrive(name: String!): String!
	"""
	Grants rights on an account's files or a drive – a directory, or the whole store when `node` is null –
	replacing an earlier grant there (needs `accounts.manage`).
	"""
	setFileAccess(account: String!, granteeKind: String!, granteeId: String!, node: String, rights: String!): Boolean!
	"""
	Removes a grant on an account's files or a drive (needs `accounts.manage`).
	"""
	removeFileAccess(account: String!, granteeKind: String!, granteeId: String!, node: String): Boolean!
	"""
	Sets the tenant's default files quota; null for no limit (needs `tenant.manage`).
	"""
	setTenantFilesQuota(bytes: Int): Boolean!
}

