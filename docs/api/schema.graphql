	"""
	addScimToken(name: String!): ScimTokenCreated!
	removeScimToken(id: String!): Boolean!
	renameInstance(name: String!): Boolean!
	addInstanceDomain(domain: String!): Boolean!
	removeInstanceDomain(domain: String!): Boolean!
	setPrimaryDomain(domain: String!): Boolean!
	"""
	Sends logins to a login UI of the instance's own (an HTTPS URL), or back to kernoid's (`null`); needs
	`instance.manage`.
	"""
	setLoginUi(url: String): Boolean!
	"""
	Creates a tenant (needs `tenants.manage`); returns its id.
	"""
	addTenant(name: String!): String!
	"""
	Renames, deactivates or reactivates a tenant (needs `tenants.manage`).
	"""
	updateTenant(id: String!, name: String, active: Boolean): Boolean!
	"""
	Defines an instance role of the instance's own, or changes its permissions – instance permissions apply at the
	instance, tenant permissions in every tenant (needs `instance_roles.manage`).
	"""
	defineInstanceRole(name: String!, permissions: [String!]!): Boolean!
	deleteInstanceRole(name: String!): Boolean!
	"""
