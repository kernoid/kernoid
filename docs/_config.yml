# SPDX-License-Identifier: AGPL-3.0-or-later
# The kernoid documentation, built by GitHub Pages from this folder (Jekyll, Just the Docs). The files in assets/ are
# copies from brand/ (brand/web, brand/svg); api/ is generated by `kernoid openapi` and `kernoid graphql-schema`,
# and CI checks that it matches the code.
title: kernoid
description: One sovereign core for email, identity and storage – documentation
# kernoid.dev (CNAME); the website for everyone else is kernoid.org (kernoid/website).
url: https://kernoid.dev
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.0
plugins:
  - jekyll-remote-theme

color_scheme: kernoid
favicon_ico: /assets/favicon.ico
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

aux_links:
  kernoid.org: https://kernoid.org
  GitHub: https://github.com/kernoid/kernoid
  Whitepaper: https://github.com/kernoid/whitepaper
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/kernoid/kernoid
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

footer_content: "kernoid is free software under AGPL-3.0-or-later – a falkOSS project."

# Every page uses the theme's layout (GitHub Pages would default to it as well; a local build does not)
defaults:
  - scope:
      path: ""
    values:
      layout: default
