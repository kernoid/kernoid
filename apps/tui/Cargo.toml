# SPDX-License-Identifier: AGPL-3.0-or-later
# kernoid's terminal app: mail, files, calendars and contacts over JMAP, on kernoid's Rust SDK (`../client`, MIT). AGPL
# like the server, but a workspace of its own, apart from the server's, so it shares neither code nor the lock file with
# it: only the protocols connect them. Dependencies are exact (`=`) and at least two weeks old when taken
# (`scripts/check-age.py`).
[workspace]

[package]
name = "kernoid-tui"
version = "0.2.1"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kernoid/kernoid"
description = "kernoid in the terminal: mail, files, calendars and contacts over JMAP"
publish = false

[[bin]]
name = "kernoid-tui"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
directories = "=6.0.0"
# kernoid's Rust SDK (MIT): JMAP, push, end-to-end encryption, DNS, iCalendar and vCard files – async; the app waits for
# it on a runtime of its own (`block`).
kernoid-client = { path = "../client" }
ratatui = "=0.30.2"
rpassword = "=7.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["fs", "rt-multi-thread"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }

# Argon2 (unlocking the key) and the post-quantum algorithms are slow without optimisation; tests build dependencies
# optimised, as the end-to-end library does.
[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
